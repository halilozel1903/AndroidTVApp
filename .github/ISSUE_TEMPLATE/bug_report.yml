name: Bug report
description: Something is broken in the Leanback sample
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this Android TV learning sample. Please include TV/emulator details when possible.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0 (from Settings → About)
  - type: input
    id: device
    attributes:
      label: Device / emulator
      placeholder: e.g. Android TV emulator API 35
